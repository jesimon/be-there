<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f3ec">
  <title>Be There</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="home-screen">
  <!-- Browsers allow sound and the camera only after a first tap. -->
  <div id="start" class="overlay start" hidden>
    <div class="overlay-card">
      <h1>Be There</h1>
      <p class="big">Tap anywhere to begin.</p>
    </div>
  </div>

  <div id="problem" class="overlay" hidden>
    <div class="overlay-card"><h1 id="problem-title">This screen needs its link</h1><p id="problem-text" class="big">Ask the family member who set it up to open the home screen link on this tablet.</p></div>
  </div>

  <main id="idle">
    <header class="home-top">
      <div>
        <p id="greeting" class="greeting"></p>
        <p id="date" class="date"></p>
      </div>
      <p id="clock" class="clock"></p>
    </header>

    <section class="status-row">
      <p id="status" class="status-pill">Connecting…</p>
      <button id="pause" class="btn big-btn" type="button">Pause visits</button>
    </section>

    <section>
      <h2 class="section-title">People who can visit you</h2>
      <div id="people" class="people"></div>
      <p id="nobody" class="muted big" hidden>Nobody yet. Your family can invite people from their organizer page.</p>
    </section>
  </main>

  <!-- Someone is at the door -->
  <div id="knock" class="overlay knock" hidden>
    <div class="overlay-card">
      <div id="knock-avatar" class="avatar huge"></div>
      <h1 id="knock-title"></h1>
      <p id="knock-sub" class="big"></p>
      <div class="actions">
        <button id="answer" class="btn yes huge-btn" type="button">Answer</button>
        <button id="decline" class="btn no huge-btn" type="button">Not now</button>
      </div>
    </div>
  </div>

  <!-- A visit in progress -->
  <div id="call" class="call" hidden>
    <video id="remote" autoplay playsinline></video>
    <video id="local" autoplay playsinline muted></video>
    <p id="with-you" class="with-you"><span class="live-dot" aria-hidden="true"></span><span id="with-you-text"></span></p>
    <button id="end" class="btn no huge-btn end" type="button">End visit</button>
  </div>

  <script type="module" src="/js/home.js"></script>
</body>
</html>
