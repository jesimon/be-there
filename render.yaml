# Render Blueprint for Be There: one web service with a small persistent disk
# for its data file and visitors' photos (a "photos" folder beside the data
# file). Pushing to main deploys automatically.
services:
  - type: web
    name: be-there
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    # The app's own address. DNS: a CNAME for "bethere" at Cloudflare pointing to
    # the service's onrender.com host, set to "DNS only". The onrender.com
    # address keeps working too.
    domains:
      - bethere.gladspring.org
    disk:
      name: be-there-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_FILE
        value: /var/data/db.json
      # Needed to create a home. Render makes a random one; read it on the
      # service's Environment page.
      - key: SETUP_PASSWORD
        generateValue: true
      # Be There's new address. With this set, visitor, organizer and setup
      # pages opened at the onrender.com address go on to it by themselves, and
      # new links point at it. The home screen never moves by itself. Only the
      # address built into lib/address.js is accepted; anything else is
      # ignored. To stop devices moving, remove this line and also delete the
      # variable on the service's Environment page (a sync may leave it there).
      # Both addresses keep working either way.
      - key: CANONICAL_ORIGIN
        value: https://bethere.gladspring.org
